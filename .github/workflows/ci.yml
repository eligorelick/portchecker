name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repository. No job needs to write to it or to use a secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to a commit. The comment names the release that commit belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version named by "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The lint script alone passes with warnings. Here a warning fails the job.
      - run: pnpm lint --max-warnings 0
      - run: pnpm format:check
      # The tests supply the vendor and model answers themselves, so this needs no API key and no
      # provider sign-in.
      - run: pnpm test
      - run: pnpm build
